<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>服务器资源总览 · 8 台服务器</title>
  <style>
    :root {
      --page: #f3f6fb;
      --ink: #172b4d;
      --muted: #7b8ba3;
      --line: #e7edf5;
      --blue: #497fee;
      --amber: #e5a136;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    .page { max-width: 1920px; margin: 0 auto; padding: 28px 32px 20px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; color: white; background: var(--blue); box-shadow: 0 5px 12px #497fee22; }
    .brand-icon svg { width: 26px; height: 26px; }
    h1 { font-size: 25px; font-weight: 650; letter-spacing: .5px; margin: 0 0 5px; }
    .subtitle { margin: 0; font-size: 12px; color: var(--muted); }
    .snapshot { text-align: right; }
    .snapshot-label { display: inline-flex; align-items: center; gap: 7px; color: #58708f; font-size: 12px; }
    .snapshot-label::before { content: ""; width: 6px; height: 6px; background: #95a6bd; border-radius: 50%; }
    .snapshot-time { display: block; margin-top: 7px; font-size: 12px; color: var(--muted); }
    .overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 23px; }
    .overview-item { display: flex; align-items: center; gap: 13px; min-width: 0; padding: 17px 20px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
    .overview-icon { width: 38px; height: 38px; display: grid; place-items: center; flex-shrink: 0; border-radius: 11px; background: #eff4ff; color: var(--blue); }
    .overview-icon svg { width: 20px; height: 20px; }
    .overview-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .overview-value { font-size: 23px; font-weight: 650; line-height: 1.1; letter-spacing: -.6px; }
    .overview-value small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 5px; letter-spacing: 0; }
    .overview-detail { display: block; font-size: 10px; color: var(--muted); margin-top: 5px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h2 { font-size: 14px; font-weight: 600; margin: 0; }
    h2 span { display: inline-block; margin-left: 7px; padding: 2px 6px; font-size: 10px; font-weight: 500; color: #7b8ba3; background: #e7edf6; border-radius: 5px; vertical-align: 1px; }
    .legend { display: flex; gap: 17px; color: var(--muted); font-size: 11px; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
    .legend .warning { background: var(--amber); }
    /* 电脑端固定四列，八台服务器恰好分为两行。 */
    .server-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .server-card { min-width: 0; overflow: hidden; padding: 19px 20px 18px; background: white; border: 1px solid #e1e8f2; border-radius: var(--radius); box-shadow: 0 3px 10px #19345603; transition: box-shadow .2s, border-color .2s; }
    .server-card:hover { border-color: #c5d5f4; box-shadow: 0 7px 22px #23476c0b; }
    .card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--line); }
    .server-name { display: flex; align-items: center; gap: 8px; }
    .server-name svg { width: 19px; height: 19px; color: #8499b8; flex-shrink: 0; }
    h3 { font-size: 19px; font-weight: 650; letter-spacing: .1px; margin: 0; white-space: nowrap; }
    .update-time { font-size: 10px; color: var(--muted); margin: 6px 0 0 27px; }
    .badge { flex-shrink: 0; margin-top: 3px; padding: 4px 6px; border-radius: 5px; background: #fff5e4; color: #b8791c; font-size: 10px; white-space: nowrap; }
    .server-number { flex-shrink: 0; color: #b8c4d5; font-size: 11px; margin-top: 5px; }
    .resource + .resource { margin-top: 17px; }
    .resource-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .resource-name { font-size: 12px; font-weight: 600; color: #40536e; }
    .resource-percent { font-size: 12px; font-weight: 600; color: var(--blue); }
    .progress { height: 8px; overflow: hidden; border-radius: 3px; background: #eaf0f7; }
    .progress-fill { height: 100%; width: var(--usage); background: var(--blue); border-radius: 3px; }
    .resource.high .resource-percent { color: #c58a26; }
    .resource.high .progress-fill { background: var(--amber); }
    .resource-details { display: flex; justify-content: space-between; gap: 4px; font-size: 10px; margin-top: 7px; color: #7f8da2; white-space: nowrap; }
    .resource-details strong { font-weight: 500; color: #40536e; }
    .resource-available { font-size: 10px; color: #91a0b4; margin-top: 4px; text-align: right; }
    footer { display: flex; justify-content: space-between; gap: 16px; font-size: 10px; line-height: 1.7; color: #8d9bb0; margin-top: 16px; }
    noscript { display: block; padding: 20px; background: white; border: 1px solid var(--line); border-radius: var(--radius); }
    @media (min-width: 1600px) {
      .page { padding: 35px 44px 24px; }
      .server-card { padding: 23px 25px 22px; }
      h3 { font-size: 21px; }
      .resource + .resource { margin-top: 21px; }
      .resource-details, .resource-available, .update-time { font-size: 11px; }
      .progress { height: 9px; }
    }
    @media (max-width: 1100px) and (min-width: 761px) {
      .page { padding: 24px 18px 18px; }
      .server-grid, .overview { gap: 12px; }
      .server-card { padding: 15px 12px; }
      h3 { font-size: 16px; }
      .server-name { gap: 5px; }
      .badge { font-size: 9px; padding: 3px 4px; }
      .overview-item { padding: 15px 12px; gap: 9px; }
    }
    @media (max-width: 760px) {
      .page { padding: 22px 20px; }
      .server-grid, .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    }
    @media (max-width: 520px) {
      .page { padding: 20px 14px; }
      .masthead { align-items: flex-start; margin-bottom: 20px; gap: 12px; }
      .brand { gap: 10px; }
      .brand-icon { width: 39px; height: 39px; border-radius: 11px; }
      h1 { font-size: 20px; }
      .subtitle { font-size: 10px; }
      .snapshot { padding-top: 3px; }
      .snapshot-label, .snapshot-time { font-size: 10px; }
      .snapshot-time { max-width: 80px; line-height: 1.5; }
      .overview { gap: 10px; margin-bottom: 22px; }
      .overview-item { padding: 13px 11px; gap: 9px; }
      .overview-icon { width: 30px; height: 30px; border-radius: 9px; }
      .overview-value { font-size: 21px; }
      .overview-detail { font-size: 9px; }
      .legend { font-size: 10px; gap: 10px; }
      .server-grid { grid-template-columns: minmax(0, 1fr); }
      .server-card { padding: 20px; }
      footer { flex-direction: column; gap: 2px; }
    }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .page { padding: 0; }
      .masthead { margin-bottom: 12px; }
      .overview { gap: 9px; margin-bottom: 12px; }
      .overview-item { padding: 10px; }
      .server-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
      .server-card { break-inside: avoid; padding: 11px; border-radius: 9px; box-shadow: none; }
      h3 { font-size: 15px; }
      .server-name { gap: 5px; }
      .server-name svg { width: 15px; }
      .badge { font-size: 8px; padding: 3px; }
      .resource + .resource { margin-top: 12px; }
      .resource-details, .resource-available { font-size: 9px; }
      .update-time { margin-left: 20px; }
      footer { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="icon-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></symbol>
    <symbol id="icon-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></symbol>
    <symbol id="icon-memory" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10v4m4-4v4m4-4v4m4-4v4M6 18v3m4-3v3m4-3v3m4-3v3"/></symbol>
    <symbol id="icon-storage" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></symbol>
  </svg>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <div class="brand-icon"><svg fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><use href="#icon-server"/></svg></div>
        <div><h1>服务器资源总览</h1><p class="subtitle">集中查看 8 台服务器的容量与使用情况</p></div>
      </div>
      <div class="snapshot"><span class="snapshot-label">截图数据快照</span><span class="snapshot-time">更新时间范围 15:22–15:27</span></div>
    </header>
    <section class="overview" id="overview" aria-label="服务器资源汇总"></section>
    <div class="section-heading">
      <h2>服务器列表 <span>08</span></h2>
      <div class="legend" aria-label="使用率颜色说明"><span><i></i>使用率 &lt; 85%</span><span><i class="warning"></i>使用率 ≥ 85%</span></div>
    </div>
    <section class="server-grid" id="server-grid" aria-label="8 台服务器资源详情"></section>
    <noscript>请启用浏览器 JavaScript 以显示服务器资源数据。</noscript>
    <footer><span>数据来源：提供的 8 张服务器截图；此页面为静态快照，未连接实时监控。</span><span>使用率 = 已用 ÷ 总容量 · 数值保留截图精度</span></footer>
  </main>
  <script>
    // 更新数据时修改此数组即可。used / available / total 分别为已用 / 可用 / 总容量。
    // 三个数值独立保留截图原值，避免更改原始数据的舍入结果。
    const servers = [
      { ip: '10.155.2.11', updated: '15:22', cpu: { used: 0.74, available: 43.16, total: 43.9 }, memory: { used: 59.56, available: 34.91, total: 94.47 }, storage: { used: 101.11, available: 31.48, total: 132.59 } },
      { ip: '10.155.2.13', updated: '15:24', cpu: { used: 2.12, available: 41.78, total: 43.9 }, memory: { used: 115.29, available: 44.34, total: 159.62 }, storage: { used: 3.16, available: 1.08, total: 4.24 } },
      { ip: '10.155.2.2', updated: '15:25', cpu: { used: 14.85, available: 18.75, total: 33.6 }, memory: { used: 335.93, available: 47.98, total: 383.91 }, storage: { used: 20.99, available: 9.45, total: 30.44 } },
      { ip: '10.155.2.3', updated: '15:25', cpu: { used: 4.08, available: 29.52, total: 33.6 }, memory: { used: 188.11, available: 67.79, total: 255.91 }, storage: { used: 5.63, available: 1.88, total: 7.51 } },
      { ip: '10.155.2.4', updated: '15:25', cpu: { used: 11.22, available: 39.06, total: 50.28 }, memory: { used: 314.21, available: 69, total: 383.21 }, storage: { used: 7.68, available: 3.11, total: 10.79 } },
      { ip: '10.155.2.5', updated: '15:27', cpu: { used: 12.38, available: 35.5, total: 47.88 }, memory: { used: 462.89, available: 48.74, total: 511.63 }, storage: { used: 36.98, available: 16.35, total: 53.33 } },
      { ip: '10.155.2.6', updated: '15:27', cpu: { used: 14.63, available: 52.41, total: 67.04 }, memory: { used: 291.19, available: 220.43, total: 511.62 }, storage: { used: 5.68, available: 1.18, total: 6.86 } },
      { ip: '10.155.2.8', updated: '15:27', cpu: { used: 3.28, available: 47, total: 50.28 }, memory: { used: 120.14, available: 7.32, total: 127.46 }, storage: { used: 9.59, available: 11.24, total: 20.83 } }
    ];
    const resources = [
      { key: 'cpu', name: 'CPU', unit: 'GHz', icon: 'cpu' },
      { key: 'memory', name: '内存', unit: 'GB', icon: 'memory' },
      { key: 'storage', name: '存储', unit: 'TB', icon: 'storage' }
    ];
    const number = value => new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 }).format(value);
    const percentage = data => data.used / data.total * 100;
    const icon = name => `<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-${name}"/></svg>`;
    const highMemoryCount = servers.filter(server => percentage(server.memory) >= 85).length;
    document.getElementById('overview').innerHTML = `
      <div class="overview-item"><div class="overview-icon">${icon('server')}</div><div><div class="overview-label">服务器总数</div><div class="overview-value">${servers.length}<small>台</small></div><span class="overview-detail">${highMemoryCount} 台内存使用率 ≥ 85%</span></div></div>
      ${resources.map(resource => {
        const sum = servers.reduce((result, server) => ({ used: result.used + server[resource.key].used, total: result.total + server[resource.key].total }), { used: 0, total: 0 });
        return `<div class="overview-item"><div class="overview-icon">${icon(resource.icon)}</div><div><div class="overview-label">${resource.name}整体使用率</div><div class="overview-value">${percentage(sum).toFixed(1)}<small>%</small></div><span class="overview-detail">${number(sum.used)} / ${number(sum.total)} ${resource.unit}</span></div></div>`;
      }).join('')}`;
    document.getElementById('server-grid').innerHTML = servers.map((server, index) => `
      <article class="server-card" aria-labelledby="server-${index}">
        <header class="card-heading">
          <div><div class="server-name">${icon('server')}<h3 id="server-${index}">${server.ip}</h3></div><p class="update-time">上次更新 ${server.updated}</p></div>
          ${percentage(server.memory) >= 85 ? '<span class="badge">内存偏高</span>' : `<span class="server-number">${String(index + 1).padStart(2, '0')}</span>`}
        </header>
        ${resources.map(resource => {
          const data = server[resource.key];
          const percent = percentage(data);
          return `<div class="resource${percent >= 85 ? ' high' : ''}">
            <div class="resource-heading"><span class="resource-name">${resource.name}</span><span class="resource-percent">${percent.toFixed(1)}%</span></div>
            <div class="progress" role="progressbar" aria-label="${server.ip} ${resource.name}使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent.toFixed(1)}" aria-valuetext="已用 ${number(data.used)} ${resource.unit}，总容量 ${number(data.total)} ${resource.unit}"><div class="progress-fill" style="--usage:${Math.min(100, Math.max(0, percent))}%"></div></div>
            <div class="resource-details"><span><strong>${number(data.used)} ${resource.unit}</strong> 已用</span><span>总容量 ${number(data.total)} ${resource.unit}</span></div>
            <div class="resource-available">可用 ${number(data.available)} ${resource.unit}</div>
          </div>`;
        }).join('')}
      </article>`).join('');
  </script>
</body>
</html>
